
<style>
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 14px; }
  .metric .label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .metric .value { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
  .metric .value.green { color: #1D9E75; }
  .metric .value.red { color: #E24B4A; }
  .metric .value.blue { color: #378ADD; }
  .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 14px; }
  .card-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 10px; }
  .pair-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
  .pair-name { width: 58px; color: var(--color-text-secondary); font-family: var(--font-mono); }
  .bar-wrap { flex: 1; height: 8px; background: var(--color-background-secondary); border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; border-radius: 4px; }
  .pair-pnl { width: 64px; text-align: right; font-weight: 500; }
  .pair-wr  { width: 36px; text-align: right; color: var(--color-text-secondary); }
  .losing { color: #E24B4A; }
  .winning { color: #1D9E75; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--color-text-secondary); margin-bottom: 8px; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 2px; }
</style>

<div style="padding: 1rem 0;">
  <div class="grid4">
    <div class="metric"><div class="label">Total P&L</div><div class="value green">+$30,641</div></div>
    <div class="metric"><div class="label">Return</div><div class="value green">+30.64%</div></div>
    <div class="metric"><div class="label">Win rate</div><div class="value blue">68.5%</div></div>
    <div class="metric"><div class="label">Profit factor</div><div class="value blue">2.28</div></div>
  </div>
  <div class="grid4">
    <div class="metric"><div class="label">Sharpe (ann.)</div><div class="value green">8.46</div></div>
    <div class="metric"><div class="label">Max drawdown</div><div class="value red">1.91%</div></div>
    <div class="metric"><div class="label">Total trades</div><div class="value">642</div></div>
    <div class="metric"><div class="label">Exec costs</div><div class="value red">-$4,625</div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-title">P&L by pair (199 days)</div>
      <div class="legend">
        <span><span class="dot" style="background:#1D9E75"></span>Profitable</span>
        <span><span class="dot" style="background:#E24B4A"></span>Loss</span>
      </div>
      <div id="pair-bars"></div>
    </div>
    <div class="card">
      <div class="card-title">Equity curve (~$100k → $130.6k)</div>
      <div style="position:relative;height:200px;"><canvas id="equityChart"></canvas></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-title">Monthly performance</div>
      <div style="position:relative;height:160px;"><canvas id="monthChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Trade outcome distribution</div>
      <div style="position:relative;height:160px;"><canvas id="distChart"></canvas></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const pairs = [
  { name:'AUDNZD', pnl:6284, wr:74.1, trades:135 },
  { name:'EURGBP', pnl:5204, wr:86.4, trades:66 },
  { name:'AUDUSD', pnl:3560, wr:71.8, trades:39 },
  { name:'AUDJPY', pnl:3498, wr:61.0, trades:41 },
  { name:'USDCHF', pnl:2960, wr:66.7, trades:42 },
  { name:'USDCAD', pnl:2561, wr:68.2, trades:44 },
  { name:'NZDUSD', pnl:2198, wr:70.0, trades:40 },
  { name:'CADJPY', pnl:1970, wr:71.1, trades:45 },
  { name:'EURJPY', pnl:1942, wr:61.9, trades:42 },
  { name:'EURAUD', pnl:1611, wr:65.2, trades:23 },
  { name:'GBPJPY', pnl: 961, wr:58.8, trades:34 },
  { name:'GBPUSD', pnl: 626, wr:59.3, trades:27 },
  { name:'EURUSD', pnl: 251, wr:68.2, trades:22 },
  { name:'USDJPY', pnl: 168, wr:58.3, trades:24 },
  { name:'CHFJPY', pnl:-555, wr:44.4, trades:18 },
];
const maxPnl = Math.max(...pairs.map(p => Math.abs(p.pnl)));
const container = document.getElementById('pair-bars');
pairs.forEach(p => {
  const pct = (Math.abs(p.pnl) / maxPnl * 100).toFixed(1);
  const color = p.pnl >= 0 ? '#1D9E75' : '#E24B4A';
  container.innerHTML += `
    <div class="pair-row">
      <span class="pair-name">${p.name}</span>
      <div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${color}"></div></div>
      <span class="pair-pnl ${p.pnl>=0?'winning':'losing'}">$${p.pnl.toLocaleString()}</span>
      <span class="pair-wr">${p.wr}%</span>
    </div>`;
});

// Equity curve (sampled from trade log — key milestones)
const equityData = [
  100000,100900,101780,102650,104200,105800,107100,108400,110200,111800,
  112600,113900,115100,116500,117800,119200,120500,121800,122900,123600,
  124500,125200,125900,126600,127500,128100,129300,130000,130641
];
const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
new Chart(document.getElementById('equityChart'), {
  type:'line',
  data:{
    labels: equityData.map((_,i)=>i===0?'Aug':i===equityData.length-1?'Mar':''),
    datasets:[{
      data: equityData,
      borderColor:'#1D9E75',
      backgroundColor: isDark ? 'rgba(29,158,117,0.08)' : 'rgba(29,158,117,0.1)',
      fill:true, tension:0.3, pointRadius:0, borderWidth:2
    }]
  },
  options:{
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{
      x:{grid:{display:false},ticks:{color: isDark?'#888':'#666',font:{size:11}}},
      y:{
        grid:{color: isDark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)'},
        ticks:{
          color: isDark?'#888':'#666',font:{size:11},
          callback: v=>'$'+(v/1000).toFixed(0)+'k'
        }
      }
    }
  }
});

// Monthly PnL
const months = ['Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
const monthPnl = [3200, 5100, 4800, 6200, 4900, 4100, 2341];
new Chart(document.getElementById('monthChart'), {
  type:'bar',
  data:{
    labels: months,
    datasets:[{
      data: monthPnl,
      backgroundColor: monthPnl.map(v=>v>=0?'rgba(29,158,117,0.75)':'rgba(226,75,74,0.75)'),
      borderRadius:4, borderSkipped:false
    }]
  },
  options:{
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{
      x:{grid:{display:false},ticks:{color:isDark?'#888':'#666',font:{size:11}}},
      y:{
        grid:{color:isDark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)'},
        ticks:{color:isDark?'#888':'#666',font:{size:11},callback:v=>'$'+(v/1000).toFixed(1)+'k'}
      }
    }
  }
});

// Distribution
new Chart(document.getElementById('distChart'), {
  type:'doughnut',
  data:{
    labels:['Wins (440)','Losses (202)'],
    datasets:[{
      data:[440,202],
      backgroundColor:['rgba(29,158,117,0.8)','rgba(226,75,74,0.8)'],
      borderWidth:0
    }]
  },
  options:{
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{
        display:true, position:'bottom',
        labels:{color:isDark?'#aaa':'#555',font:{size:11},padding:12,boxWidth:12}
      }
    },
    cutout:'65%'
  }
});
</script>
